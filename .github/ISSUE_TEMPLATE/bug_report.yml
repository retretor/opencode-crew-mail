name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The agents involved, how they were started (in parallel, in the background), the tool calls.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Lines of crew-mail.log
      description: From <data dir>/opencode/log/crew-mail.log. Remove anything private first.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "opencode 2.2.3, opencode-crew-mail 0.1.0, Node 22, Windows 11"
    validations:
      required: true
