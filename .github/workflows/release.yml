name: Release

# Push a tag like v0.2.0 after the version in package.json and CHANGELOG.md is set. This makes a GitHub release with
# the notes of that version and, if the repository variable NPM_PUBLISH is "true", publishes to npm with provenance
# (set up npm "trusted publishing" for this repository and this workflow on npmjs.com first).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Notes from CHANGELOG.md
        run: awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## " v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: npm
        if: vars.NPM_PUBLISH == 'true'
        run: npx --yes npm@11 publish --provenance --access public
